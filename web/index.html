<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울 가로수길 · WALK SEOUL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="shell">

  <!-- ── 상단 헤더 ────────────────────────────────────────── -->
  <header class="topbar">
    <div class="brand">
      <span class="mark">🌿</span>
      <span class="name">서울 가로수길</span>
      <span class="en">WALK SEOUL</span>
    </div>
    <nav class="seasons" id="seasons" aria-label="현재 표시 중인 계절"></nav>
    <div class="stats" id="stats"></div>
  </header>

  <!-- ── 본문 3분할 ───────────────────────────────────────── -->
  <div class="body">

    <aside class="side">
      <div class="side-head"><span>테마 경로 목록</span></div>
      <div class="themelist" id="themelist"></div>
    </aside>

    <div class="mapwrap">
      <div id="map"></div>
      <div class="legend" id="legend" hidden></div>
      <div class="credit">서울시 가로수 데이터 기반 · Esri, HERE, Garmin &copy; OpenStreetMap</div>
      <div class="boot" id="boot">가로수 데이터를 불러오는 중…</div>
    </div>

    <aside class="chat" id="chatpanel">
      <div class="chat-head">
        <div class="ch-title">🗺 경로 추천 챗봇</div>
        <div class="ch-sub">계절·수종·분위기를 자유롭게 입력하세요</div>
        <div class="chips" id="chips"></div>
      </div>

      <div class="chat-scroll" id="chatlog"></div>

      <div class="chat-foot">
        <form class="field" id="chatform">
          <input id="q" type="text" autocomplete="off"
                 placeholder="예: 가을에 은행나무 단풍길 추천해줘">
          <button type="submit" id="send" disabled aria-label="보내기">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
        <p class="disclaimer">서울시 가로수 공개데이터 기반 · 실제 경로와 차이가 있을 수 있습니다</p>
      </div>
    </aside>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="trees.js"></script>
<script src="app.js"></script>
</body>
</html>
